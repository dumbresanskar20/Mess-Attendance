version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mess_tokens_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_mess_2026
      MYSQL_DATABASE: mess_tokens
      MYSQL_USER: mess_user
      MYSQL_PASSWORD: mess_secure_password_2026
      TZ: Asia/Kolkata
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
      - --log-bin-trust-function-creators=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_mess_2026"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
    driver: local
